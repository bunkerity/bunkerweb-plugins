# Codecov only reports coverage (README badge). The repository sets no coverage percentage, so nothing here gates CI.
comment: false
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
# One flag per `unit` matrix job (go, python, lua). Each flag is uploaded on every run, so carryforward
# is not needed (Codecov docs, "Flags": carryforward is for runs that skip part of the tests).
flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    # Flag `paths` are globs, not regexes (docs.codecov.com/docs/flags: "accepts globs, not regexes").
    - name: go
      paths:
        - "coraza/api/**"
    - name: python
      paths:
        - "*/ui/**"
        - "*/jobs/**"
    - name: lua
      paths:
        - "*/*_helpers.lua"
# `go test -coverprofile` names files after the Go module (bw-coraza), not the repository path.
fixes:
  - "bw-coraza/::coraza/api/"
