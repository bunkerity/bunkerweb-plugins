name: Tests

# Least privilege by default: every job below is read-only unless it says
# otherwise, so the GITHUB_TOKEN never inherits the repository-wide scope.
permissions: read-all

on:
  push:
    branches: [dev, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plumber:
    uses: ./.github/workflows/plumber.yml
    permissions:
      contents: read
      security-events: write
      id-token: write

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  tag:
    runs-on: ubuntu-latest
    outputs:
      bw_tag: ${{ steps.tag.outputs.bw_tag }}
    steps:
      - name: Resolve latest stable BunkerWeb tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Always test against the latest STABLE BunkerWeb release, resolved at
          # runtime so it never goes stale. GitHub's releases/latest endpoint
          # excludes drafts and pre-releases (rc/beta), giving us "stable".
          # Same tag on every branch (dev and main) — there is no pinned version.
          # `|| true`: a 404 (no stable release yet) or rate-limit makes gh exit
          # non-zero, which under `bash -e` would abort the step here with a raw
          # error. Swallow it so the empty tag falls through to the case below
          # and reports our own diagnostic.
          tag="$(gh api repos/bunkerity/bunkerweb/releases/latest --jq .tag_name || true)"
          tag="${tag#v}" # release tag may be "v1.6.1"; Docker tags have no "v"
          case "$tag" in
          "" | *-*)
            echo "::error::could not resolve a stable BunkerWeb tag (got '${tag:-<empty>}')"
            exit 1
            ;;
          esac
          echo "Resolved latest stable BunkerWeb tag: $tag"
          echo "bw_tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check the resolved tag is declared compatible
        run: python3 misc/check_compatibility.py "${{ steps.tag.outputs.bw_tag }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Install Lua toolchain
        # The luacheck pre-commit hook is language:lua and needs luarocks on the
        # runner to bootstrap its environment.
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Prettier
        # The prettier hook is language:system and resolves prettier from the
        # repo's pinned package-lock.json via npx.
        run: npm ci
      - name: Run pre-commit
        run: pre-commit run --all-files

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [go, python, lua]
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # --- Go : coraza API service ---
      - name: Set up Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - name: Run Go unit tests
        if: matrix.lang == 'go'
        working-directory: coraza/api
        run: |
          # No go.sum is committed (the Dockerfile resolves deps at build time),
          # so populate it before testing. Build tag must match the binary.
          go mod tidy
          go test -tags=coraza.rule.multiphase_evaluation -coverprofile=coverage.out -covermode=atomic ./...

      # --- Python : ui/actions.py ---
      - name: Set up Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run Python unit tests
        if: matrix.lang == 'python'
        run: |
          # requests and urllib3 are needed by tests/test_syswarden_client.py: it loads
          # syswarden/jobs/syswarden_client.py, the one job module that deliberately owns
          # the HTTP dependencies so the helper modules stay importable with the stdlib alone.
          pip install pytest requests urllib3
          # pytest-cov is reporting only: without it the tests still run, as before.
          if pip install pytest-cov; then
            pytest tests/ -q --cov=. --cov-report=
          else
            echo "::warning::pytest-cov unavailable, running the tests without coverage"
            pytest tests/ -q
          fi
      - name: Write the Python coverage report
        if: matrix.lang == 'python'
        continue-on-error: true
        # Only the plugin sources the tests exercise: each plugin's ui/ and jobs/ Python, never tests/.
        run: coverage xml --include='*/ui/*.py,*/jobs/*.py' -o coverage.xml

      # --- Lua : busted specs ---
      - name: Run Lua unit tests
        if: matrix.lang == 'lua'
        run: |
          sudo apt-get update
          # liblua5.4-dev provides headers for busted's C deps; pin the luarocks
          # tree to 5.4 so the busted CLI runs against the lua5.4 we installed.
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks
          sudo luarocks --lua-version=5.4 install busted
          # Coverage is reporting only: without luacov the specs still run, as before.
          # luacov-reporter-lcov: Codecov does not read luacov's own report, it does read LCOV.
          # .luacov restricts coverage to the plugin *_helpers.lua modules and picks the lcov reporter.
          if sudo luarocks --lua-version=5.4 install luacov && sudo luarocks --lua-version=5.4 install luacov-reporter-lcov; then
            busted --coverage
          else
            echo "::warning::luacov unavailable, running the specs without coverage"
            busted
          fi
      - name: Write the Lua coverage report
        if: matrix.lang == 'lua'
        continue-on-error: true
        run: luacov

      # Reporting only: a failed upload (or a fork PR, which gets no secret) never fails the job.
      # fail_ci_if_error makes the action stop before running an uploader whose signature or checksum
      # does not verify; continue-on-error keeps that from failing the job.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          files: ${{ matrix.lang == 'go' && 'coraza/api/coverage.out' || matrix.lang == 'python' && 'coverage.xml' || 'luacov.report.lcov' }}
          flags: ${{ matrix.lang }}
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    needs: [tag, lint, unit]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          [
            clamav,
            cloudflare,
            coraza,
            virustotal,
            authentik,
            notifier,
            sentinelone,
            syswarden,
            openappsec,
          ]
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Pull and build BW
        run: bash .tests/bw.sh "${{ needs.tag.outputs.bw_tag }}"
      - name: Run ${{ matrix.plugin }} tests
        run: bash .tests/${{ matrix.plugin }}.sh

  build-push:
    # Publishing is gated on Plumber too: a pipeline that fails its own
    # supply-chain scan must not push an image to Docker Hub.
    needs: [plumber, tag, integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push APIs
        run: bash .tests/build-push.sh "${{ needs.tag.outputs.bw_tag }}"
