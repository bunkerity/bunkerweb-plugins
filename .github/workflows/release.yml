name: Release (signed tag)

# Like BunkerWeb, a maintainer signs and pushes the tag; CI verifies it before
# creating a draft. No private signing key is stored in this workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag + release
      actions: read # verify Tests succeeded for this commit on main
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Use the protected branch, then verify it still matches the tested commit.
          ref: main
          fetch-depth: 0 # full history so generated release notes are complete
          persist-credentials: false

      - name: Verify main is the tested commit
        env:
          TESTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - name: Resolve plugin version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # All plugin.json carry the same version (kept in lockstep by
          # misc/update_version.sh), so any one of them is the source of truth.
          version="$(jq -r .version clamav/plugin.json)"
          case "$version" in
          "" | null | *[!0-9.]*)
            echo "::error::unexpected plugin version '$version'"
            exit 1
            ;;
          esac
          test "$TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify signed tag and successful tests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          if ! jq -e '.object.type == "tag"' <<<"$tag_ref" >/dev/null; then
            echo "::error::$TAG must be an annotated, signed tag"
            exit 1
          fi
          object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
          if ! jq -e --arg sha "$GITHUB_SHA" '.verification.verified == true and .object.type == "commit" and .object.sha == $sha' <<<"$tag_object" >/dev/null; then
            echo "::error::$TAG must have a GitHub-verified signature and target the triggering commit"
            exit 1
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?branch=main&event=push&head_sha=$GITHUB_SHA&status=success&per_page=100" |
            jq -e --arg sha "$GITHUB_SHA" 'any(.[].workflow_runs[]; .head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")' >/dev/null

      - name: Skip if this version is already released
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Match across ALL releases, including unpublished drafts.
          # The assignment aborts the step if `gh api` fails (no fail-open to
          # "create" on an auth/network error).
          tags="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')"
          if grep -Fxq "$TAG" <<<"$tags"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists (including drafts) — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release for $TAG yet — creating a draft."
          fi

      - name: Create draft release
        if: steps.guard.outputs.exists == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          draft: true # published by a maintainer after a quick review
          generate_release_notes: true # auto-changelog from merged PRs/commits
          body: |
            BunkerWeb external plugins **${{ steps.version.outputs.tag }}**.

            Install a plugin by mounting its directory into the scheduler's `/data/plugins`
            (see the README). Coraza ships its WAF API as `bunkerity/bunkerweb-coraza`.
