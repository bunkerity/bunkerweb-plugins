map $http_cookie $mock_authed {
    default 0;
    "~*mock_session=valid" 1;
}

server {
    listen 9000;
    server_name _;

    # Authentik forward-auth decision endpoint:
    # 200 (+ identity headers) when the session cookie is present, else 401.
    location = /outpost.goauthentik.io/auth/nginx {
        default_type text/plain;
        add_header X-authentik-username "alice";
        add_header X-authentik-email "alice@example.com";
        add_header X-authentik-groups "admins";
        if ($mock_authed = 0) {
            return 401 "unauthorized";
        }
        return 200 "ok";
    }

    # Browser-facing outpost endpoints (start, callback, sign_out, ...).
    location /outpost.goauthentik.io {
        default_type text/plain;
        return 200 "MOCK AUTHENTIK OUTPOST PATH";
    }

    location / {
        default_type text/plain;
        return 404 "not found";
    }
}

# --- TLS outpost (issue #220 regression) -------------------------------------
# Reproduces a TLS-terminating front (Cloudflare, shared ingress, ...): the
# default server rejects any handshake that carries no SNI, so a proxy_pass
# without `proxy_ssl_server_name on` fails the handshake instead of reaching
# the outpost.
server {
    listen 9443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 9443 ssl;
    # A real outpost is reached with SNI = its own FQDN but Host = the protected
    # app's FQDN (authentik routes on it), and nginx re-selects the vhost on Host.
    # A regex server_name matches both while leaving the no-SNI case on the
    # default server above.
    server_name ~^.+$;
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    location = /outpost.goauthentik.io/auth/nginx {
        default_type text/plain;
        if ($mock_authed = 0) {
            return 401 "unauthorized";
        }
        return 200 "ok";
    }

    location /outpost.goauthentik.io {
        default_type text/plain;
        return 200 "MOCK AUTHENTIK OUTPOST PATH";
    }
}
