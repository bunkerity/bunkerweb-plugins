# Stub Coraza API that always fails with a JSON body. It stands in for a sidecar that
# answers non-200 (a crashing or overloaded Coraza service), so the plugin folds the
# decoded body into its error message: that used to raise "attempt to concatenate a
# table value" instead of logging it.
server {
    listen 8080;
    default_type application/json;

    location / {
        return 503 '{"error":"stub unavailable"}';
    }
}
