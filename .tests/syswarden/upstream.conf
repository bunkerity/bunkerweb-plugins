# Upstream for the syswarden e2e tests.
#
# The usual nginxdemos/nginx-hello answers 200 on every path, which makes it useless
# here: the push direction needs BunkerWeb to actually ban somebody, and bad-behavior
# only counts responses whose status is in BAD_BEHAVIOR_STATUS_CODES. So this upstream
# serves the root and genuinely 404s anything else, which is what the test hammers.
server {
    listen 8080;

    location = / {
        default_type text/plain;
        return 200 "hello\n";
    }

    location / {
        default_type text/plain;
        return 404 "not found\n";
    }
}
