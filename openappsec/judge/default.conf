# open-appsec judge configuration for the agent-unified sidecar.
# Mount this file at /etc/nginx/conf.d/default.conf inside ghcr.io/openappsec/agent-unified.
# The attachment needs nginx to proxy the request: a bare return never reads the body,
# and proxying back into the same nginx lost enforcement in testing, so every request is
# proxied to a tiny echo upstream that always answers 200. There is deliberately no other
# location: BunkerWeb replays the client's URI verbatim, so any path handled here without
# going through the attachment would be a path the client could use to skip inspection.
server {
    listen 80;
    server_name _;

    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;

    # Docker's embedded DNS. A literal hostname in proxy_pass is resolved once at startup,
    # so a restarted echo container (new IP) would turn every request into a 502; resolving
    # through a variable re-resolves it every 10 s instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $echo bw-openappsec-echo;
        proxy_pass http://$echo:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
        client_max_body_size 0;
        add_header X-Openappsec-Judge pass;
    }
}
